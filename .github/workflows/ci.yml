name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests and vet
        run: |
          go test ./...
          go vet ./...

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows/amd64
          - windows/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build Windows installer
        env:
          CGO_ENABLED: "0"
        run: go run github.com/egoist/mygo/cmd/mygo@v0.5.5 build -platform "${{ matrix.platform }}"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-keydesk-${{ matrix.platform == 'windows/amd64' && 'windows-amd64' || 'windows-arm64' }}
          path: dist/*/*Setup*.exe
